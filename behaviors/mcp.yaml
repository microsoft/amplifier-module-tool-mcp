bundle:
  name: mcp-behavior
  version: 0.2.0
  description: Model Context Protocol integration with automatic server discovery

tools:
  - module: tool-mcp
    source: git+https://github.com/microsoft/amplifier-module-tool-mcp@main
    config:
      # Server output control
      verbose_servers: false  # Show MCP server debug output (default: false)
      server_log_dir: ~/.amplifier/logs/mcp-servers/  # Where logs are saved when suppressed
      
      # Content size protection (prevents context exhaustion)
      # Content exceeding this limit is automatically truncated with a notice
      max_content_size: 50000  # Maximum chars (~12k tokens, default: 50000)
      
      # Optional trusted host inline config (overrides external configuration)
      # Most users configure servers in host-owned ~/.amplifier/mcp.json
      # Server discovery, highest priority first:
      #   1. Trusted host inline servers (here; review bundles before use)
      #   2. AMPLIFIER_MCP_CONFIG: absolute host-owned file outside the project
      #   3. Host-owned user config: ~/.amplifier/mcp.json
      # Project discovery is disabled for both stdio and HTTP.
      # Project paths, symlink aliases into projects, and hardlinks are rejected.
      # servers:
      #   postgres:
      #     command: npx
      #     args: ["-y", "@modelcontextprotocol/server-postgres"]
      #     env:
      #       POSTGRES_CONNECTION_STRING: "${DATABASE_URL}"
      #   puppeteer:
      #     command: npx
      #     args: ["-y", "@modelcontextprotocol/server-puppeteer"]
