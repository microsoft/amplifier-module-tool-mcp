[project]
name = "amplifier-module-tool-mcp"
version = "0.2.2"
description = "MCP (Model Context Protocol) tool module for Amplifier"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Brian Krabach" },
]
dependencies = [
    # Floor of 1.24: below this version the `streamable_http_client` symbol
    # does not exist under that name in `mcp.client.streamable_http` (it was
    # named `streamablehttp_client`). Verified empirically -- 1.23.0 and every
    # earlier release fail at import; 1.24.0 is the first that works.
    # Upper bound intentionally left open -- 2.x's field renames
    # (camelCase -> snake_case) are handled via
    # amplifier_module_tool_mcp.sdk_compat, so both 1.x and 2.x are supported.
    "mcp>=1.24",
    "pydantic>=2.0",
]

[project.entry-points."amplifier.modules"]
tool-mcp = "amplifier_module_tool_mcp:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_tool_mcp"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "amplifier-core",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.2",
]

[tool.uv.sources]
amplifier-core = { git = "https://github.com/microsoft/amplifier-core", branch = "main" }

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "strict"
